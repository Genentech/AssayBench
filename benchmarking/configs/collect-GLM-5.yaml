# Configuration for collecting predictions from local LLM

# Inherit base collection config
defaults:
  - collect-predictions

# Model name for organizing outputs (change this!)
model_name: "GLM-5"

# LM configuration for local model
lm:
  provider: "local"
  model: "zai-org/GLM-5-FP8"  # FP8 variant — BF16 needs ~1,490GB, too large for 8xB200
  max_tokens: 128000
  temperature: 1.0
  top_p: 0.95
  api_base: "http://localhost:8060/v1"
  api_key: "token-abc123"

# Collection settings
collection:
  n_runs: 5  # Increase this later to expand runs (e.g., 5 -> 10 will add 5 more runs)
  collect_train: true
  collect_val: true
  collect_test: true
  save_frequency: 5  # Save intermediate results every N examples (default: 5)
