# Configuration for ensemble baseline evaluation

# Ensemble settings
ensemble:
  n_runs: 5  # Number of inference runs per question
  method: "topk_threshold"  # Options: rank_frequency, frequency, rank_average, reciprocal_rank, intersection_only, topk_threshold
  top_k: 100  # Number of top genes to return in ensemble
  min_appearances: 3  # For 'intersection_only': minimum number of runs a gene must appear in
  topk_threshold: 20  # For 'topk_threshold': only consider genes ranked in top-N of at least one run
  use_cache: true  # Use cached predictions if available
  cache_filename: "predictions_cache/gpt-5-mini-5-runs.json"  # Name of cache file to save/load predictions

# Dataset settings
dataset:
  fold: 0
  max_examples: null  # null = all examples, or set to a number
  split_type: "easy_split"
  relevance_score_name: "thresholded_geometric_relevance_scores"
  prompt_template_key: "objective_ranking_prompt"
  mounted_dir: "./data/"  # Base directory for dataset files
  cache_directory: "screensQA"
  seed: 42

# Ranking evaluation settings
evaluation:
  k_values: [5, 10, 20, 50, 100]
  use_thresholded_scoring: true

# DSPy LM settings
dspy_lm:
  # Azure OpenAI configuration
  provider: "azure"  # or "openai" for standard OpenAI
  model: "gpt-5-mini"  # Your deployment name
  max_tokens: 16000
  temperature: 1.0  # Higher temperature for more diversity across runs
  reasoning_effort: low

# Output settings
output:
  save_dir: "./output/ensemble_baseline/gpt-5-mini/"

# Random seed for reproducibility
seed: 42
