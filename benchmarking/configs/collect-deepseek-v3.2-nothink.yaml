# Configuration for collecting predictions from DeepSeek V3.2 (no thinking)
# Same as deepseek-v3.2 but with thinking mode disabled.
# Serve with: ./serve.sh deepseek-ai/DeepSeek-V3.2 --tensor-parallel-size 8 \
#   --tokenizer-mode deepseek_v32 --tool-call-parser deepseek_v32 \
#   --enable-auto-tool-choice --reasoning-parser deepseek_v3 --port 8000 --api-key token-abc123

# Inherit base collection config
defaults:
  - collect-predictions

# Model name for organizing outputs
model_name: "deepseek-v3.2-nothink"

# LM configuration for local model
lm:
  provider: "local"
  model: "deepseek-ai/DeepSeek-V3.2"
  max_tokens: 128000
  temperature: 1.0
  top_p: 0.95
  api_base: "http://localhost:8000/v1"
  api_key: "token-abc123"
  chat_template_kwargs:
    enable_thinking: false

# Collection settings
collection:
  n_runs: 5
  collect_train: true
  collect_val: true
  collect_test: true
  save_frequency: 5
  num_workers: 8
