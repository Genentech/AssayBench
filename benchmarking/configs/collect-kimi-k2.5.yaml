# Configuration for collecting predictions from local LLM

# Inherit base collection config
defaults:
  - collect-predictions

# Model name for organizing outputs (change this!)
model_name: "Kimi-K2.5"

# LM configuration for local model
lm:
  provider: "local"
  model: "moonshotai/Kimi-K2.5"  # Change to match your model
  api_base: "http://localhost:8020/v1"
  max_tokens: 128000
  temperature: 1.0
  top_p: 0.95
  api_key: "token-abc123"

# Collection settings
collection:
  n_runs: 5  # Increase this later to expand runs (e.g., 5 -> 10 will add 5 more runs)
  collect_train: true
  collect_val: true
  collect_test: true
  save_frequency: 5  # Save intermediate results every N examples (default: 5)
  num_workers: 8  # Number of parallel workers (1 = sequential, >1 = parallel)
