# Configuration for collecting LLM predictions - Gemini 3 Flash

defaults:
  - collect-predictions

# Model name for organizing outputs
model_name: "gemini-3-flash"

# Collection settings
collection:
  n_runs: 1  # Number of inference runs per example
  collect_train: true  # Collect predictions on train split
  collect_val: true  # Collect predictions on val split
  collect_test: true  # Collect predictions on test split
  num_workers: 8  # Number of parallel workers (1 = sequential, >1 = parallel)
  retry_failed: false  # Re-run examples where all predictions failed (empty)

# LM configuration
lm:
  provider: "gemini"  # Options: azure, openai, anthropic, gemini, local
  model: "gemini-3-flash-preview"  # Model name
  max_tokens: 32000
  temperature: 1.0
