# Configuration for collecting predictions from MiniMax-M2.5

# Inherit base collection config
defaults:
  - collect-predictions

# Model name for organizing outputs
model_name: "MiniMax-M2.5"

# LM configuration for local model
lm:
  provider: "local"
  model: "MiniMaxAI/MiniMax-M2.5"
  max_tokens: 128000
  temperature: 1.0
  top_p: 0.95
  top_k: 40
  api_base: "http://localhost:8020/v1"
  api_key: "token-abc123"

# Collection settings
collection:
  n_runs: 5
  collect_train: true
  collect_val: true
  collect_test: true
  save_frequency: 5
  num_workers: 16
