# Configuration for collecting Claude Haiku 4.5 predictions

# Inherit base collection config
defaults:
  - collect-predictions

# Model name for organizing outputs
model_name: "claude-haiku-4.5"

# LM configuration for Claude via Anthropic API
lm:
  provider: "anthropic"
  model: "claude-haiku-4-5-20251001"
  max_tokens: 8000
  temperature: 1.0

# Collection settings
collection:
  n_runs: 1
  collect_train: true
  collect_val: true
  collect_test: true
  num_workers: 8
  save_frequency: 5
