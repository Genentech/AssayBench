[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assaybench"
version = "0.1.0"
description = "AssayBench: a gene ranking benchmark for evaluating LLMs on biological assay data"
readme = "README.md"
authors = [{name = "Edward De Brouwer", email = "debroue1@gene.com"}, {name = "Carl Edwards", email = "edwardc24@gene.com"}]
urls = {Homepage = "https://genentech.github.io/AssayBench"}
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "datasets>=4.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assaybench = [
    "data/**/*.yaml",
    "data/**/*.tsv",
    "data/**/*.json",
]
