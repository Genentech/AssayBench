[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assaybench"
version = "0.2.0"
description = "AssayBench: a gene ranking benchmark for evaluating LLMs on biological assay data"
readme = "README.md"
authors = [{name = "Edward De Brouwer", email = "debroue1@gene.com"}, {name = "Carl Edwards", email = "edwardc24@gene.com"}]
urls = {Homepage = "https://genentech.github.io/AssayBench"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "datasets>=4.0.0",
    "numpy>=1.24.0",
    # assaybench.utils.score_maps imports scipy.stats.rankdata. This was missing
    # from 0.1.0, so `pip install assaybench` gave an ImportError on any code
    # path reaching RankingMetrics unless scipy happened to be installed.
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assaybench = "assaybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assaybench = [
    "data/**/*.yaml",
    "data/**/*.tsv",
    "data/**/*.json",
    "data/**/*.csv",
    "data/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
