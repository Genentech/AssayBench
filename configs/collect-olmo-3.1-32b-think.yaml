# Configuration for collecting predictions from OLMo 3.1 32B Think

# Inherit base collection config
defaults:
  - collect-predictions

# Model name for organizing outputs
model_name: "olmo-3.1-32b-think"

# LM configuration for local model
lm:
  provider: "local"
  model: "allenai/Olmo-3.1-32B-Think"
  max_tokens: 32768
  temperature: 0.6
  top_p: 0.95
  api_base: "http://localhost:8070/v1"
  api_key: "token-abc123"

# Collection settings
collection:
  n_runs: 5
  collect_train: true
  collect_val: true
  collect_test: true
  save_frequency: 5
  num_workers: 12
