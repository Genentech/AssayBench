# Configuration for few-shot kNN prediction collection
#
# Default: gemini-3-pro with 10 nearest-neighbor examples.
# Override lm.model and model_name for other models, e.g.:
#   python scripts/collect_fewshot_predictions.py \
#     model_name=gemini-3-flash-fewshot-knn10 lm.model=gemini-3-flash

model_name: "gemini-3-pro-fewshot-knn10"

# Collection settings
collection:
  n_runs: 1
  collect_train: true
  collect_val: true
  collect_test: true
  num_workers: 8
  retry_failed: true
  save_frequency: 5              # save intermediate results every N examples

# LM configuration
lm:
  provider: "gemini"
  model: "gemini-3-pro-preview"        # override to gemini-3-flash-preview for testing
  max_tokens: 32000
  temperature: 1.0

# Few-shot kNN settings
fewshot:
  k: 10                         # number of nearest neighbors as examples
  top_genes: 100                 # genes per demo answer
  require_matching_reverse: true # only match screens with same reverse flag

# Dataset settings
dataset:
  dataset_path: "./data/biogrid_v0.4_combined"
  split_type: "year"
  fold: 0
  max_examples: null

# Output settings -- predictions land in fewshot_predictions/<model_name>/
output:
  save_dir: "./output/multi_model_ensemble/fewshot_predictions/"

# Random seed
seed: 42
