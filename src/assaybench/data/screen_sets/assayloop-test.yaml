version: 2
description: 'Sequential-screening test set used in the AssayLoop paper: 20 genome-wide screens
  curated from the AssayBench public test split (Genentech/assaybench, biogrid, yearfold0=''test'',
  334 eligible entries). This is NOT the whole public test split -- it is a diversity-stratified
  subset with a Gemini AnDCG@100 >= 0.05 signal floor, so screens no method can beat random
  on do not dominate the average. Baselines are scored for audit only; no LLM-vs-baseline
  winner balancing is applied. The selection script is scripts/select_default_public_screens.py
  in the AssayLoop repo.'
source:
  dataset: Genentech/assaybench
  config: biogrid
  split_field: yearfold0
  split_value: test
selection_criteria:
  num_genes_min: 18000
  num_genes_max: 22000
  num_hits_min: 50
  max_hit_rate: 0.15
  gemini_signal_floor: true
  min_gemini_andcg: 0.05
  winner_balance: false
  max_per_phenotype: 6
  max_per_phenotype_is_soft: true
  quality_metric: gemini-3-pro adjusted_ndcg@100
  quality_weight: 0.5
  scoring_methods:
    llm: gemini-3-pro
    baselines:
    - oracle_knn
    - embedding_knn
    - phenotype_hit_freq
  stratification: Per cleaned_phenotype, allocate slots proportional to the eligible split
    distribution with a soft cap of six per phenotype (relaxed only if needed to reach n_target);
    within each phenotype, diversify via greedy max-min on TF-IDF of (phenotype | condition_clause
    | cell_line | cell_type | library_methodology), lightly weighted by gemini-3-pro AnDCG@100.
    No LLM-vs-baseline winner balancing is applied.
  n_target: 20
screens:
